# .github/workflows/deploy.yml
name: Build and Deploy to Kubernetes

on:
    push:
      branches: [main]
    workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-challenge

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: tag
        run: echo "tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Verify cluster
        run: |
          kubectl get nodes

      - name: Deploy
        run: |
            kubectl apply -f k8s/
            kubectl set image deployment/flask-app \
            flask-app=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n capstone

            kubectl rollout status deployment/flask-app \
            -n capstone \
            --timeout=120s